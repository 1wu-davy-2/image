<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>暗房 · 系统设置</title>
    <meta name="theme-color" content="#f6f1e6" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23f6f1e6'/%3E%3Cpath d='M3 11c3-4 7-4 10 0' stroke='%234f6f72' stroke-width='1.4' fill='none'/%3E%3Ccircle cx='8' cy='5.5' r='2' fill='%23c9b07a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="studio-page" data-nav="settings">
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <p class="eyebrow">UU API · Image</p>
          <h1>暗房</h1>
        </div>
        <nav class="nav top-nav" id="topNav" aria-label="画坊菜单"></nav>
        <div class="top-trailing" id="userMenu"></div>
      </div>
      <div class="motif" aria-hidden="true">
        <svg viewBox="0 0 1200 36" fill="none">
          <path d="M20 22c18-14 36-14 54 0s36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0" stroke="currentColor" stroke-opacity="0.45" stroke-width="1" />
          <path d="M0 12 C80 4, 140 20, 220 10 S360 4, 440 14 600 6, 700 16 860 4, 960 12 1100 6, 1200 14" stroke="var(--gold)" stroke-opacity="0.55" stroke-width="1" />
          <path d="M90 28c12-10 28-10 40 0M250 28c12-10 28-10 40 0M430 28c12-10 28-10 40 0M610 28c12-10 28-10 40 0M790 28c12-10 28-10 40 0M970 28c12-10 28-10 40 0" stroke="var(--green)" stroke-opacity="0.5" stroke-width="1" />
          <circle cx="180" cy="10" r="1.6" fill="var(--cinnabar)" opacity="0.55" />
          <circle cx="520" cy="8" r="1.4" fill="var(--gold)" opacity="0.7" />
          <circle cx="860" cy="11" r="1.6" fill="var(--cinnabar)" opacity="0.5" />
        </svg>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="shell-main">
        <div class="page-head">
          <p class="eyebrow">画坊</p>
          <h2>系统设置</h2>
          <p>改中文名和密码，或者退出登录。</p>
        </div>

        <div class="stack settings-stack">
          <section class="card" aria-label="账号信息">
            <div class="card-head">
              <h3>账号</h3>
            </div>
            <div class="split">
              <div>
                <label>名称</label>
                <p id="accountName" class="account-value">—</p>
              </div>
              <div>
                <label>邮箱</label>
                <p id="accountEmail" class="account-value">—</p>
              </div>
              <div>
                <label>手机号</label>
                <p id="accountPhone" class="account-value">—</p>
              </div>
              <div>
                <label>注册时间</label>
                <p id="accountCreated" class="account-value">—</p>
              </div>
            </div>
            <p class="hint">名称、邮箱、手机号定了就不让改，只有中文名可以随时改。</p>
          </section>

          <section class="card" aria-label="中文名">
            <div class="card-head">
              <h3>中文名</h3>
            </div>
            <form id="profileForm">
              <label for="displayName">显示用的中文名</label>
              <input id="displayName" name="displayName" maxlength="24" placeholder="留空就显示名称" />
              <p class="hint">最多 24 个字。填了之后，顶栏和公开作品里都显示它。</p>
              <div class="spaced-lg">
                <button type="submit" class="primary">保存</button>
              </div>
              <p id="profileStatus" class="status" role="status" aria-live="polite"></p>
            </form>
          </section>

          <section class="card" aria-label="改密码">
            <div class="card-head">
              <h3>改密码</h3>
            </div>
            <form id="passwordForm">
              <div class="split">
                <div>
                  <label for="oldPassword">原密码</label>
                  <input id="oldPassword" type="password" autocomplete="current-password" />
                </div>
                <div>
                  <label for="newPassword">新密码</label>
                  <input id="newPassword" type="password" autocomplete="new-password" />
                </div>
              </div>
              <p class="hint">新密码至少 8 位。</p>
              <div class="spaced-lg">
                <button type="submit" class="primary">保存新密码</button>
              </div>
              <p id="passwordStatus" class="status" role="status" aria-live="polite"></p>
            </form>
          </section>

          <section class="card" aria-label="退出">
            <div class="card-head">
              <h3>退出</h3>
            </div>
            <p class="hint">退出后要重新登录才能生图。</p>
            <div class="spaced-lg">
              <button type="button" id="logoutBtn" class="danger">退出登录</button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="./config.js"></script>
    <script src="./shell.js"></script>
    <script src="./settings.js"></script>
  </body>
</html>
