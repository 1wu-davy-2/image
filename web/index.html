<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>暗房 · 把愿望画成图</title>
    <meta name="theme-color" content="#f6f1e6" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23f6f1e6'/%3E%3Cpath d='M3 11c3-4 7-4 10 0' stroke='%234f6f72' stroke-width='1.4' fill='none'/%3E%3Ccircle cx='8' cy='5.5' r='2' fill='%23c9b07a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="landing">
    <main class="hero">
      <picture>
        <source media="(max-width: 640px)" srcset="./art/hero-tall.jpg" />
        <img class="hero-photo" src="./art/hero-wide.jpg" alt="敦煌飞天：飘带、祥云与月" />
      </picture>
      <div class="hero-veil" aria-hidden="true"></div>
      <div class="paper-grain" aria-hidden="true"></div>

      <div class="hero-inner">
        <p class="eyebrow hero-eyebrow">敦煌</p>
        <h1 class="hero-title">暗房</h1>
        <p class="hero-lede">把愿望画成图。</p>

        <div class="hero-actions">
          <a class="btn primary btn-lg" id="startBtn" href="./studio">开始创作</a>
          <a class="btn btn-lg" href="./admin">管理画坊</a>
        </div>

        <section class="facts" aria-label="画坊三事">
          <p class="eyebrow">画坊三事</p>
          <div class="fact-grid">
            <article class="card fact">
              <h2>签到领额度</h2>
              <p>每天签到可领新的画额。轻轻一点，便能再画几幅。</p>
            </article>
            <article class="card fact">
              <h2>GPT 与 Gemini 生图</h2>
              <p>GPT 生图、Nano Banana 香蕉生图、Gemini 官方直连，四种调用方式。把句子交给暗房。</p>
            </article>
            <article class="card fact">
              <h2>Key 与余额在管理端</h2>
              <p>画坊钥匙、余额与签到规则，都收在管理页。不打扰创作。</p>
            </article>
          </div>
        </section>
      </div>

      <footer class="hero-foot">暗房 · 敦煌 · 莫高窟飞天为母题</footer>
    </main>

    <script src="./config.js"></script>
    <script src="./landing.js"></script>
  </body>
</html>
