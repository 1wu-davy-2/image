<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>暗房 · 首页</title>
    <meta name="theme-color" content="#f6f1e6" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23f6f1e6'/%3E%3Cpath d='M3 11c3-4 7-4 10 0' stroke='%234f6f72' stroke-width='1.4' fill='none'/%3E%3Ccircle cx='8' cy='5.5' r='2' fill='%23c9b07a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="studio-page" data-nav="home">
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <p class="eyebrow">UU API · Image</p>
          <h1>暗房</h1>
        </div>
        <div class="top-trailing" id="userMenu"></div>
      </div>
      <div class="motif" aria-hidden="true">
        <svg viewBox="0 0 1200 36" fill="none">
          <path d="M20 22c18-14 36-14 54 0s36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0 36 14 54 0 36-14 54 0" stroke="currentColor" stroke-opacity="0.45" stroke-width="1" />
          <path d="M0 12 C80 4, 140 20, 220 10 S360 4, 440 14 600 6, 700 16 860 4, 960 12 1100 6, 1200 14" stroke="var(--gold)" stroke-opacity="0.55" stroke-width="1" />
          <path d="M90 28c12-10 28-10 40 0M250 28c12-10 28-10 40 0M430 28c12-10 28-10 40 0M610 28c12-10 28-10 40 0M790 28c12-10 28-10 40 0M970 28c12-10 28-10 40 0" stroke="var(--green)" stroke-opacity="0.5" stroke-width="1" />
          <circle cx="180" cy="10" r="1.6" fill="var(--cinnabar)" opacity="0.55" />
          <circle cx="520" cy="8" r="1.4" fill="var(--gold)" opacity="0.7" />
          <circle cx="860" cy="11" r="1.6" fill="var(--cinnabar)" opacity="0.5" />
        </svg>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="shell-main">
        <div class="page-head">
          <p class="eyebrow">画坊</p>
          <h2 id="greeting">欢迎回来</h2>
          <p id="subtitle">每天签到领额度，攒够了就去创作。</p>
        </div>

        <div class="layout layout-even">
          <section class="card" aria-label="额度与签到">
            <div class="card-head">
              <h3>额度</h3>
              <button type="button" id="checkinLogBtn" class="link-button">签到记录 →</button>
            </div>
            <div class="card-head">
              <div>
                <span class="eyebrow">剩余</span>
                <div><strong id="quota" class="quota-number">0</strong> <span class="hint-inline">额度</span></div>
              </div>
              <button type="button" id="checkinBtn" class="primary small">签到领额度</button>
            </div>
            <p id="checkinHint" class="hint"></p>
            <div class="hairline"></div>
            <div class="row-actions">
              <a class="btn primary" href="./create">去创作</a>
              <a class="btn" href="./gallery">看作品集</a>
            </div>
          </section>

          <section class="card" aria-label="最近作品">
            <div class="card-head">
              <h3>最近</h3>
              <a href="./gallery" class="hint-inline">全部作品 →</a>
            </div>
            <div id="recent" class="work-grid work-grid-tight"></div>
          </section>
        </div>
      </main>
    </div>

    <dialog id="checkinDialog" class="dialog">
      <div class="dialog-head">
        <h3>签到记录</h3>
        <button type="button" id="checkinClose" class="ghost">关闭</button>
      </div>
      <div id="checkinLog" class="log-list"></div>
      <div class="dialog-foot">
        <button type="button" id="checkinPrev" class="small">上一页</button>
        <span id="checkinPage" class="hint-inline"></span>
        <button type="button" id="checkinNext" class="small">下一页</button>
      </div>
      <p id="checkinLogStatus" class="status" role="status"></p>
    </dialog>

    <script src="./config.js"></script>
    <script src="./shell.js"></script>
    <script src="./home.js"></script>
  </body>
</html>
